      WEB_CONF_XSS_CSP_ENABLED: ${WEB_CONF_XSS_CSP_ENABLED:-false}
      WEB_CONF_XSS_CSP_POLICY: ${WEB_CONF_XSS_CSP_POLICY:-"default-src 'self'"}
      WEB_CONF_XSS_CSP_REPORT_ONLY_POLICY: ${WEB_CONF_XSS_CSP_REPORT_ONLY_POLICY:-""}
      WEB_CONF_CACHE_CONTROL: ${WEB_CONF_CACHE_CONTROL:-""}
      WEB_CONF_PRAGMA: ${WEB_CONF_PRAGMA:-""}
    expose:
    - 8585
    - 8586
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully
    networks:
    - app_net
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8586/healthcheck
    ports:
    - 8585:8585
  ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:1.12.6
    depends_on:
      elasticsearch:
        condition: service_started
      mysql:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: /opt/airflow/dag_generated_configs
      DB_HOST: ${AIRFLOW_DB_HOST:-mysql}
      DB_PORT: ${AIRFLOW_DB_PORT:-3306}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_db}
      DB_SCHEME: ${AIRFLOW_DB_SCHEME:-mysql+mysqldb}
      DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
      DB_PROPERTIES: ${AIRFLOW_DB_PROPERTIES:-}
    entrypoint: /bin/bash
    command:
    - /opt/airflow/ingestion_dependency.sh
    expose:
    - 8080
    networks:
    - app_net
    volumes:
    - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
    - ingestion-volume-dags:/opt/airflow/dags
    - ingestion-volume-tmp:/tmp
    - ./infra/check_ingestion_health.py:/lab/check_ingestion_health.py:ro
    ports:
    - 8080:8080
    healthcheck:
      test:
      - CMD
      - python3
      - /lab/check_ingestion_health.py
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 40
  postgres-lab:
    ports:
    - 5432:5432
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: movilidad
      POSTGRES_USER: estudiante
      POSTGRES_PASSWORD: estudiante_lab
    volumes:
    - postgres-lab-data:/var/lib/postgresql/data
    - ./actividad/sql/01_preparar_caso.sql:/docker-entrypoint-initdb.d/01_caso.sql:ro
    - ./infra/02_lector.sql:/docker-entrypoint-initdb.d/02_lector.sql:ro
    - ./actividad/sql:/lab-sql:ro
    networks:
    - app_net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U estudiante -d movilidad
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: ghcr.io/teableio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command:
    - server
    - /data
    - --console-address
    - :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_lab
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio-data:/data
    networks:
    - app_net
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 30
  minio-init:
    image: ghcr.io/teableio/minio-mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    entrypoint:
    - /bin/sh
    - /lab/storage.sh
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: minioadmin
      MINIO_PASSWORD: minioadmin_lab
    volumes:
    - ./infra/storage.sh:/lab/storage.sh:ro
    - ./actividad/fuentes:/fuentes:ro
    - ./actividad/manifiestos:/manifiestos:ro
    networks:
    - app_net
    depends_on:
      minio:
        condition: service_healthy
    command:
    - iniciar
  archivos:
    image: ghcr.io/teableio/minio-mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    entrypoint:
    - /bin/sh
    - /lab/storage.sh
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: minioadmin
      MINIO_PASSWORD: minioadmin_lab
    volumes:
    - ./infra/storage.sh:/lab/storage.sh:ro
    - ./actividad/fuentes:/fuentes:ro
    - ./actividad/manifiestos:/manifiestos:ro
    networks:
    - app_net
    depends_on:
      minio:
        condition: service_healthy
    profiles:
    - herramientas
    command:
    - listar
  carga:
    build:
      context: .
      dockerfile: infra/carga/Dockerfile
    profiles:
    - herramientas
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: catalogo_storage
      S3_SECRET_KEY: lector_storage_lab
      S3_BUCKET: movilidad
      PGHOST: postgres-lab
      PGDATABASE: movilidad
      PGUSER: estudiante
      PGPASSWORD: estudiante_lab
    volumes:
    - ./infra/carga:/app:ro
    - ./actividad/sql:/lab-sql:ro
    networks:
    - app_net
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres-lab:
        condition: service_healthy
networks:
  app_net:
    driver: bridge
name: openmetadata-lab
